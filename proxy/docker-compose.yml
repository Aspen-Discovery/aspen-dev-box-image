services:
  proxy:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=true"
      - "--providers.docker.constraints=Label(`aspen.proxy`,`true`)"
      - "--providers.docker.network=aspen-proxy"
    ports:
      - "${PROXY_HTTP_PORT:-8083}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "aspen.proxy=true"
      - "traefik.http.routers.aspen-proxy-api.rule=Host(`aspen-proxy.localhost`)"
      - "traefik.http.routers.aspen-proxy-api.service=api@internal"
      - "traefik.http.routers.aspen-proxy-api.entrypoints=web"
    networks:
      - aspen-proxy

networks:
  aspen-proxy:
    name: aspen-proxy
    external: true

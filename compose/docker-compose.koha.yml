services:
  aspen-dev-box:
    networks:
      - aspen-net
      - kohanet

  aspen-db:
    networks:
      - aspen-net
      - kohanet

  koha-oauth-init:
    image: docker:cli
    attach: false
    restart: 'no'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "$ASPEN_DOCKER/scripts/setup_koha_oauth.sh:/setup.sh:ro"
    command: ["sh", "/setup.sh"]
    environment:
      - KOHA_STACK=${KOHA_STACK:-kohadev}
    depends_on:
      aspen-db:
        condition: service_healthy

networks:
  kohanet:
    external: true
    name: ${KOHA_STACK:-kohadev}_kohanet 
